experiment: rgb_oneshot_50k
mode: rgb_oneshot
seed: 42
output_dir: outputs/rgb_oneshot_50k

data:
  image_size: 128
  num_workers: 0

model:
  base_channels: 32
  channel_mults: [1, 2, 4, 8]
  dropout: 0.0

diffusion:
  steps: 8

training:
  max_steps: 50000
  batch_size: 4
  grad_accum: 4
  learning_rate: 0.00002
  ema_decay: 0.995
  ema_update_every: 10
  amp: true
  log_every: 50
  validate_every: 5000
  save_every: 5000
  max_val_batches: 20
