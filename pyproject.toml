[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gray-cold-diffusion"
version = "0.1.0"
description = "Paired grayscale-anchored Cold Diffusion pilot for underwater image restoration"
requires-python = ">=3.10"
dependencies = [
  "huggingface_hub>=0.34,<2",
  "matplotlib>=3.7",
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "Pillow>=10.0",
  "pyiqa>=0.1.13,<0.2",
  "PyYAML>=6.0",
  "scipy>=1.10",
  "torch>=2.2",
  "torchvision==0.20.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
